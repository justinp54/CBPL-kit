# Physical properties
properties:
  rho_solvent: 0.725   # g/mL  — ipe density
  rho_solute:  1.049   # g/mL  — Acetic Acid density at 25 °C
  rho_carrier: 1.000   # g/mL  — n-Bromopropane density at 25 °C
  mw_solute:   60.05   # g/mol — Propionic Acid molar mass (for NaOH titration → mol/L)
