[project]
name = "cbpl-kit"
version = "0.1.0"
description = "Interactive toolkit for the liquid-liquid extraction experiment in the SNU CBE process laboratory"
requires-python = ">=3.10"
# pyyaml is a runtime dependency, not a dev one: config.py imports it at module
# level to read a system definition, so every entry point needs it.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

# Spelled out because the repository root holds more than the package: setuptools
# finds public/ and scripts/ alongside experiments/ and refuses to guess. namespaces
# is on because experiments/ has no __init__.py — it is a container, not a module.
[tool.setuptools.packages.find]
include = ["experiments", "experiments.experiment_06"]
namespaces = true

[tool.setuptools.package-data]
"experiments.experiment_06" = ["systems/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["experiments/experiment_06/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # lambda assignment (short math helpers in scipy calls)
    "N802",   # function name should be lowercase (scientific: _E_to_R, _R_to_E)
    "N803",   # argument name should be lowercase (scientific: V_R0, pt_E1, etc.)
    "N806",   # variable in function should be lowercase (pt_R0, wpa_R0, etc.)
    "N815",   # mixed-case variable in class scope (scientific variable names)
    "N816",   # mixed-case variable in global scope (EQUIL_DATA keys, etc.)
]

exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"experiments/experiment_06/legacy/*" = ["E402", "E701", "I001", "W"]  # legacy reference script
"experiments/experiment_06/tests/*" = ["F401", "I001"]   # test suite: unused imports, import order
"experiments/experiment_06/*.py" = ["I001", "UP037"]  # pre-existing import sort / annotation issues (tracked in HANDOFF A2)
"public/exp06/*.py" = ["I001", "UP037"]          # pre-existing import sort / annotation issues (tracked in HANDOFF A2)
"paper/*.py" = ["E741"]                                  # ambiguous variable name `l` in extract_manuscript.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
